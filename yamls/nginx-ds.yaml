apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nginx-daemonset-test2-addedexception-prscan-disabled
  namespace: default
  labels:
    app: nginx
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - name: nginx-html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: nginx-html
        emptyDir: {}
      tolerations:
      - operator: "Exists"   # Allows scheduling on all nodes (including tainted nodes)
      nodeSelector:
        kubernetes.io/os: linux
      restartPolicy: Always
